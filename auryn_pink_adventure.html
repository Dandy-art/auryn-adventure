<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff5fa8">
<meta name="description" content="Auryn's Pink Adventure — 2D fantasy platformer.">
<title>Auryn's Pink Adventure</title>
<style>
:root{color-scheme:dark;--pink:#ff8bc8;--deep:#170a1e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep);font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;overscroll-behavior:none}
main{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#170a1e;user-select:none;-webkit-user-select:none}
canvas{display:block;max-width:100vw;max-height:100dvh;box-shadow:0 16px 60px #0008}
#touch-controls[hidden]{display:none}
.cluster{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px;z-index:10}
.left{left:max(12px,env(safe-area-inset-left))}
.right{right:max(12px,env(safe-area-inset-right));gap:12px}
.touch-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #f8c4e4aa;border-radius:50%;background:#ffffff26;color:#fff;font-weight:900;box-shadow:0 5px 20px #0004;backdrop-filter:blur(5px);touch-action:none;user-select:none}
.touch-btn.small{width:60px;height:60px;font-size:20px}
.touch-btn.big{width:76px;height:76px;font-size:24px}
.touch-btn .sub{font-size:9px;letter-spacing:1.5px;opacity:.8;margin-top:2px}
.touch-btn.pressed{background:#f472b6b3;border-color:#fff;transform:scale(.95)}
.down-wrap{padding-bottom:4px}
.pause{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:48px;height:48px;border-radius:12px;background:#ffffff26;border:2px solid #f8c4e4aa;color:white;font-size:18px;font-weight:900;z-index:10;touch-action:none}
@media(pointer:fine){#touch-controls{display:none!important}}
</style>
</head>
<body>
<main>
<canvas id="game" aria-label="Auryn's Pink Adventure game canvas"></canvas>
<div id="touch-controls" hidden>
  <div class="cluster left">
    <button class="touch-btn big" data-key="left" aria-label="Kiri">◀</button>
    <div class="down-wrap"><button class="touch-btn small" data-key="down" data-fire="true" aria-label="Turun">▼</button></div>
    <button class="touch-btn big" data-key="right" aria-label="Kanan">▶</button>
  </div>
  <div class="cluster right">
    <button class="touch-btn small" data-key="attack" aria-label="Magic attack"><span>B</span><span class="sub">MAGIC</span></button>
    <button class="touch-btn big" data-key="jump" aria-label="Lompat"><span>A</span><span class="sub">JUMP</span></button>
  </div>
  <button class="pause" data-key="pause" data-fire="true" aria-label="Jeda">❙❙</button>
</div>
</main>

x.beginPath();\n        ctx.ellipse(-5.5, -2.5, 4.6, 2.8, 0, 0, Math.PI * 2);\n        ctx.ellipse(5.5, -2.5 - Math.max(0, Math.sin(t * 9)) * 2, 4.6, 2.8, 0, 0, Math.PI * 2);\n        ctx.fill();\n        ctx.stroke();\n        // tail\n        ctx.fillStyle = '#bfe89a';\n        ctx.beginPath();\n        ctx.moveTo(-12, -8);\n        ctx.lineTo(-17, -5);\n        ctx.lineTo(-12, -3.5);\n        ctx.closePath();\n        ctx.fill();\n        // shell dome\n        ctx.fillStyle = '#43b25f';\n        ctx.strokeStyle = '#1f7a3c';\n        ctx.lineWidth = 2;\n        ctx.beginPath();\n        ctx.arc(0, -11 + waddle * 0.2, 13, Math.PI, Math.PI * 2);\n        ctx.quadraticCurveTo(13, -3, 9, -2.5);\n        ctx.lineTo(-9, -2.5);\n        ctx.quadraticCurveTo(-13, -3, -13, -11 + waddle * 0.2);\n        ctx.closePath();\n        ctx.fill();\n        ctx.stroke();\n        // rim band\n        ctx.fillStyle = '#d9f2c0';\n        (0, draw_1.rr)(ctx, -12.5, -5.5, 25, 4.5, 2.2);\n        ctx.fill();\n        ctx.strokeStyle = '#1f7a3c';\n        ctx.lineWidth = 1.4;\n        ctx.stroke();\n        // shell spots\n        ctx.fillStyle = '#2f8f4c';\n        ctx.beginPath();\n        ctx.arc(-5, -13, 2.4, 0, 7);\n        ctx.arc(4, -15, 2, 0, 7);\n        ctx.arc(0, -9.5, 1.8, 0, 7);\n        ctx.fill();\n        // head\n        ctx.fillStyle = '#9ade5f';\n        ctx.strokeStyle = '#4f9430';\n        ctx.lineWidth = 1.8;\n        ctx.beginPath();\n        ctx.ellipse(11, -12 + waddle * 0.3, 6.2, 5.4, 0, 0, Math.PI * 2);\n        ctx.fill();\n        ctx.stroke();\n        ctx.fillStyle = '#fff';\n        ctx.beginPath();\n        ctx.arc(13, -13.5, 2.1, 0, 7);\n        ctx.fill();\n        ctx.fillStyle = '#233';\n        ctx.beginPath();\n        ctx.arc(13.6, -13.5, 1.05, 0, 7);\n        ctx.fill();\n        ctx.strokeStyle = '#4f9430';\n        ctx.lineWidth = 1.2;\n        ctx.beginPath();\n        ctx.arc(13.5, -9.8, 1.7, 0.2, Math.PI - 0.6);\n        ctx.stroke();\n    }  - 250;\n            const y = 150 + bg.hill[i] * 120;\n            ctx.fillStyle = 'rgba(255,255,255,0.75)';\n            ctx.beginPath();\n            ctx.ellipse(x, y, 70, 18, 0, 0, Math.PI * 2);\n            ctx.fill();\n            ctx.fillStyle = 'rgba(255,255,255,0.5)';\n            ctx.beginPath();\n            ctx.moveTo(x - 50, y + 8);\n            ctx.quadraticCurveTo(x, y + 40, x + 50, y + 8);\n            ctx.fill();\n        }\n    }\n    if (theme === 'castle') {\n        for (let i = 0; i < 4; i++) {\n            const x = ((i * 640 + bg.hill[i] * 240 - camX * 0.28) % (types_1.VIEW_W + 700)) - 350;\n            drawCastleSil(ctx, x, types_1.VIEW_H - 60, 0.8 + bg.hill[i] * 0.4, i % 2 ? '#3a2752' : '#4a3364');\n        }\n        // bats circling the blood moon\n        for (let i = 0; i < 7; i++) {\n            const bx = ((i * 260 + t * (26 + (i % 3) * 16) - camX * 0.35) % (types_1.VIEW_W + 300) + (types_1.VIEW_W + 300)) % (types_1.VIEW_W + 300) - 150;\n            const by = 52 + ((i * 53) % 168) + Math.sin(t * 1.8 + i * 2.2) * 16;\n            drawBgBat(ctx, bx, by, t * 3 + i, 0.55 + (i % 3) * 0.3);\n        }\n    }\n    // far hills layer\n    if (theme === 'hills' || theme === 'forest' || theme === 'sky') {\n        for (let i = 0; i < 8; i++) {\n            const x = i * 300 + bg.hill[i] * 120 - camX * 0.35;\n            drawHill(ctx, ((x % 2600) + 2600) % 2600 - 300, types_1.VIEW_H - 70, 380, 90 + bg.hill[i] * 50, pal.hill2);\n        }\n    }\n    // near hills / trunks\n    for (let i = 0; i < 7; i++) {\n        const x = i * 340 + bg.hill[i + 4] * 160 - camX * 0.55;\n        const xx = ((x % 2500) + 2500) % 2500 - 250;\n        if (theme === 'forest') {\n            drawTree(ctx, xx, types_1.VIEW_H - 60, 1.2 + bg.tree[i] * 0.8, true);\n        }\n        else if (theme !== 'castle') {\n            drawHill(ctx, xx, types_1.VIEW_H - 40, 420, 120 + bg.tree[i] * 60, pal.hill1);\n        }\n    }\n    if (theme === 'forest') {\n        for (let i = 0; i < 7; i++) {\n            const x = i * 340 + bg.tree[i] * 160 - camX * 0.75;\n            const xx = ((x % 2500) + 2500) % 2500 - 250;\n            drawTree(ctx, xx, types_1.VIEW_H - 34, 1.5 + bg.hill[i] * 0.7, false);\n        }\n        // fireflies\n        for (let i = 0; i < 14; i++) {\n            const fx = ((bg.tree[i] * 3000 + Math.sin(t * 0.8 + i) * 60 - camX * 0.85) % (types_1.VIEW_W + 200)) - 100;\n            const fy = 200 + bg.hill[i] * 200 + Math.cos(t * 1.3 + i * 2) * 30;\n            ctx.fillStyle = `rgba(255, 214, 130, ${0.4 + 0.4 * Math.sin(t * 3 + i)})`;\n            ctx.beginPath();\n            ctx.arc(fx, fy, 2.4, 0, Math.PI * 2);\n            ctx.fill();\n        }\n    }\n}\n// ---------- tiles ----------\nfunction drawTile(ctx, c, gx, gy, theme, t, grassTop, bump) {\n    const pal = exports.PALS[theme];\n    const x = gx * types_1.TILE;\n    const y = gy * types_1.TILE - bump;\n    const h = (0, types_1.hash2)(gx, gy);\n    switch (c) {\n        case 'G': {\n            ctx.fillStyle = pal.dirt;\n            ctx.fillRect(x, y, types_1.TILE, types_1.TILE);\n            ctx.fillStyle = pal.dirtDark;\n            for (let i = 0; i < 3; i++) {\n                const hx = (0, types_1.hash2)(gx * 3 + i, gy);\n                ctx.beginPath();\n                ctx.arc(x + 8 + hx * 24, y + 14 + (0, types_1.hash2)(gx, gy + i) * 22, 2.4, 0, Math.PI * 2);\n                ctx.fill();\n            }\n            if (grassTop) {\n                ctx.fillStyle = pal.grass;\n                rr(ctx, x - 0.5, y - 3, types_1.TILE + 1, 16, 5);\n                ctx.fill();\n                ctx.fillStyle = pal.grassEdge;\n                rr(ctx, x - 0.5, y - 3, types_1.TILE + 1, 7, 4);\n                ctx.fill();\n                ctx.fillStyle = pal.grass;\n                for (let i = 0; i < 3; i++) {\n                    const bx = x + 6 + i * 13 + h * 4;\n                    ctx.beginPath();\n                    ctx.arc(bx, y - 3, 3, Math.PI, 0);\n                    ctx.fill();\n                }\n            }\n            break;\n        }\n        case 'R': {\n            ctx.fillStyle = pal.dirtDark;\n            ctx.fillRect(x, y, types_1.TILE, types_1.TILE);\n            ctx.fillStyle = 'rgba(0,0,0,0.12)';\n            if (h > 0.4)\n                ctx.fillRect(x + 6 + h * 18, y + 8 + h * 14, 6, 4);\n            if (h < 0.5)\n                ctx.fillRect(x + 22 - h * 14, y + 24, 7, 4);\n            break;\n        }\n        case 'S': {\n            ctx.fillStyle = pal.stone;\n            ctx.fillRect(x, y, types_1.TILE, types_1.TILE);\n            ctx.strokeStyle = pal.stoneDark;\n            ctx.lineWidth = 2;\n            ctx.strokeRect(x + 2, y + 2, types_1.TILE - 4, types_1.TILE - 4);\n            ctx.fillStyle = 'rgba(255,255,255,0.18)';\n            ctx.fillRect(x + 3, y + 3, types_1.TILE - 6, 4);\n            break;\n        }\n        case 'B': {\n            ctx.fillStyle = theme === 'castle' ? '#8c5a66' : '#c9803f';\n            ctx.fillRect(x, y, types_1.TILE, types_1.TILE);\n            ctx.strokeStyle = 'rgba(60,30,10,0.5)';\n            ctx.lineWidth = 2;\n            ctx.beginPath();\n            ctx.moveTo(x, y + 20);\n            ctx.lineTo(x + types_1.TILE, y + 20);\n            ctx.moveTo(x + 20, y);\n            ctx.lineTo(x + 20, y + 20);\n            ctx.moveTo(x + 10, y + 20);\n            ctx.lineTo(x + 10, y + types_1.TILE);\n            ctx.moveTo(x + 30, y + 20);\n            ctx.lineTo(x + 30, y + types_1.TILE);\n            ctx.stroke();\n            ctx.fillStyle = 'rgba(255,255,255,0.15)';\n            ctx.fillRect(x, y, types_1.TILE, 3);\n            break;\n        }\n        case 'U': {\n            ctx.fillStyle = '#8d7450';\n            ctx.fillRect(x, y, types_1.TILE, types_1.TILE);\n            ctx.strokeStyle = '#6b5638';\n            ctx.lineWidth = 2;\n            ctx.strokeRect(x + 2, y + 2, types_1.TILE - 4, types_1.TILE - 4);\n            for (const [rx, ry] of [[7, 7], [33, 7], [7, 33], [33, 33]]) {\n                ctx.fillStyle = '#6b5638';\n                ctx.beginPath();\n                ctx.arc(x + rx, y + ry, 2, 0, Math.PI * 2);\n                ctx.fill();\n            }\n            break;\n        }\n        case '?':\n        case 'M':\n        case 'N':\n        case 'K':\n        case 'L': {\n            const pulse = 0.5 + 0.5 * Math.sin(t * 4 + gx);\n            ctx.fillStyle = '#f4b942';\n            rr(ctx, x + 1, y + 1, types_1.TILE - 2, types_1.TILE - 2, 6);\n            ctx.fill();\n            ctx.fillStyle = '#ffd97a';\n            rr(ctx, x + 4, y + 4, types_1.TILE - 8, types_1.TILE - 8, 5);\n            ctx.fill();\n            ctx.fillStyle = '#b57e14';\n            for (const [rx, ry] of [[8, 8], [32, 8], [8, 32], [32, 32]]) {\n                ctx.beginPath();\n                ctx.arc(x + rx, y + ry, 2.2, 0, Math.PI * 2);\n                ctx.fill();\n            }\n            ctx.save();\n            ctx.globalAlpha = 0.85 + pulse * 0.15;\n            const cxp = x + 20, cyp = y + 21;\n            if (c === '?') {\n                text(ctx, '?', cxp, cyp - 1, 22, '#8a5a00', { stroke: '#5d3a00', strokeW: 4, weight: 900 });\n            }\n            else if (c === 'M') {\n                ctx.fillStyle = '#ff7fbf';\n                ctx.beginPath();\n                ctx.arc(cxp, cyp - 2, 7, Math.PI, 0);\n                ctx.fill();\n                ctx.fillStyle = '#fff';\n                ctx.beginPath();\n                ctx.arc(cxp - 3, cyp - 5, 1.6, 0, 7);\n                ctx.fill();\n                ctx.fillRect(cxp - 2.5, cyp - 2, 5, 6);\n            }\n            else if (c === 'N') {\n                star(ctx, cxp, cyp, 8, 4.2, 5, '#fff200', '#c79100', 0);\n            }\n            else if (c === 'K') {\n                gem(ctx, cxp, cyp, 7, '#ff7ad9', '#c13d9d');\n            }\n            else {\n                heart(ctx, cxp, cyp, 8, '#ff5f9e', '#b02d62');\n            }\n            ctx.restore();\n            break;\n        }\n        case 'T': {\n            if (theme === 'sky') {\n                ctx.fillStyle = '#ffffff';\n                ctx.beginPath();\n                ctx.arc(x + 10, y + 26, 14, 0, Math.PI * 2);\n                ctx.arc(x + 24, y + 20, 17, 0, Math.PI * 2);\n                ctx.arc(x + 34, y + 27, 12, 0, Math.PI * 2);\n                ctx.fill();\n                ctx.fillStyle = '#d6f0ff';\n                ctx.beginPath();\n                ctx.ellipse(x + 20, y + 34, 18, 6, 0, 0, Math.PI * 2);\n                ctx.fill();\n            }\n            else {\n                ctx.fillStyle = theme === 'cave' || theme === 'castle' ? exports.PALS[theme].stone : '#8a5a34';\n                ctx.fillRect(x + 1, y + 12, types_1.TILE - 2, 26);\n                ctx.fillStyle = 'rgba(0,0,0,0.18)';\n                ctx.fillRect(x + 1, y + 30, types_1.TILE - 2, 8);\n                ctx.fillStyle = theme === 'cave' || theme === 'castle' ? exports.PALS[theme].grassEdge : pal.grass;\n                rr(ctx, x - 1, y + 4, types_1.TILE + 2, 14, 5);\n                ctx.fill();\n                ctx.fillStyle = theme === 'forest' ? '#7fd877' : pal.grassEdge;\n                rr(ctx, x - 1, y + 4, types_1.TILE + 2, 6, 4);\n                ctx.fill();\n            }\n            break;\n        }\n        case 'W': {\n            ctx.fillStyle = '#a8712f';\n            ctx.fillRect(x, y + 8, types_1.TILE, 16);\n            ctx.strokeStyle = '#7c4d1c';\n            ctx.lineWidth = 2;\n            ctx.strokeRect(x + 1, y + 9, types_1.TILE - 2, 14);\n            ctx.fillStyle = '#7c4d1c';\n            ctx.beginPath();\n            ctx.arc(x + 4, y + 16, 2.5, 0, Math.PI * 2);\n            ctx.arc(x + types_1.TILE - 4, y + 16, 2.5, 0, Math.PI * 2);\n            ctx.fill();\n            ctx.fillStyle = 'rgba(255,255,255,0.2)';\n            ctx.fillRect(x + 2, y + 10, types_1.TILE - 4, 3);\n            break;\n        }\n        case '[':\n        case ']': {\n            const left = c === '[';\n            ctx.fillStyle = '#2f9e3e';\n            ctx.fillRect(x, y + 4, types_1.TILE, types_1.TILE - 4);\n            ctx.fillStyle = '#3dbb4f';\n            ctx.fillRect(x, y, types_1.TILE, 10);\n            ctx.fillStyle = '#7fe38a';\n            if (left)\n                ctx.fillRect(x + 4, y + 4, 6, types_1.TILE - 4);\n            ctx.fillStyle = '#1f7a2c';\n            if (left)\n                ctx.fillRect(x, y, 3, types_1.TILE);\n            else\n                ctx.fillRect(x + types_1.TILE - 3, y, 3, types_1.TILE);\n            ctx.fillStyle = 'rgba(0,0,0,0.15)';\n            ctx.fillRect(x, y + 12, types_1.TILE, 2);\n            break;\n        }\n        case '{':\n        case '}': {\n            const left = c === '{';\n            ctx.fillStyle = '#3dbb4f';\n            ctx.fillRect(x + (left ? 2 : 0), y, types_1.TILE - 2, types_1.TILE);\n            ctx.fillStyle = '#7fe38a';\n            if (left)\n                ctx.fillRect(x + 6, y, 6, types_1.TILE);\n            ctx.fillStyle = '#1f7a2c';\n            if (left)\n                ctx.fillRect(x + 2, y, 3, types_1.TILE);\n            else\n                ctx.fillRect(x + types_1.TILE - 5, y, 3, types_1.TILE);\n            break;\n        }\n        case '^': {\n            ctx.fillStyle = '#4a4f5a';\n            ctx.fillRect(x, y + 30, types_1.TILE, 10);\n            ctx.fillStyle = '#c3cad6';\n            for (let i = 0; i < 2; i++) {\n                ctx.beginPath();\n                ctx.moveTo(x + 2 + i * 20, y + 32);\n                ctx.lineTo(x + 10 + i * 20, y + 8);\n                ctx.lineTo(x + 18 + i * 20, y + 32);\n                ctx.closePath();\n                ctx.fill();\n            }\n            ctx.fillStyle = '#8a93a3';\n            for (let i = 0; i < 2; i++) {\n                ctx.beginPath();\n                ctx.moveTo(x + 10 + i * 20, y + 10);\n                ctx.lineTo(x + 14 + i * 20, y + 32);\n                ctx.lineTo(x + 10 + i * 20, y + 32);\n                ctx.closePath();\n                ctx.fill();\n            }\n            break;\n        }\n        case 'C': {\n            drawCoin(ctx, x + types_1.TILE / 2, y + types_1.TILE / 2, t + gx * 0.35, 1);\n            break;\n        }\n        case 'i': {\n            const glow = 0.5 + 0.5 * Math.sin(t * 2.4 + gx * 1.7);\n            ctx.save();\n            ctx.globalAlpha = 0.25 + glow * 0.25;\n            ctx.fillStyle = '#d98bff';\n            ctx.beginPath();\n            ctx.arc(x + 20, y + 24, 20, 0, Math.PI * 2);\n            ctx.fill();\n            ctx.restore();\n            const hanging = (0, types_1.hash2)(gx, 7) > 0.5;\n            drawBgCrystals(ctx, x + 20, hanging ? y + 6 : y + 34, 1.1, 0.9);\n            break;\n        }\n        case 'm': {\n            const glow = theme === 'forest' || theme === 'cave';\n            if (glow) {\n                ctx.save();\n                ctx.globalAlpha = 0.2 + 0.2 * Math.sin(t * 2 + gx);\n                ctx.fillStyle = '#ff9ad5';\n                ctx.beginPath();\n                ctx.arc(x + 20, y + 22, 17, 0, Math.PI * 2);\n                ctx.fill();\n                ctx.restore();\n            }\n            ctx.fillStyle = '#fff3e0';\n            ctx.fillRect(x + 15, y + 22, 10, 14);\n            ctx.fillStyle = glow ? '#ff7ac8' : '#ff5f6d';\n            ctx.beginPath();\n            ctx.arc(x + 20, y + 24, 13, Math.PI, 0);\n            ctx.closePath();\n            ctx.fill();\n            ctx.fillStyle = 'rgba(255,255,255,0.9)';\n            ctx.beginPath();\n            ctx.arc(x + 14, y + 20, 2.6, 0, Math.PI * 2);\n            ctx.arc(x + 26, y + 18, 2.2, 0, Math.PI * 2);\n            ctx.fill();\n            break;\n        }\n        case 'v': {\n            const col = ['#ff8fc7', '#ffd23f', '#ffffff'][Math.floor(h * 3) % 3];\n            ctx.strokeStyle = '#3f9636';\n            ctx.lineWidth = 2;\n            ctx.beginPath();\n
